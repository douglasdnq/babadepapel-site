<head>

<meta property="og:description" content="Diagnóstico de 2 minutos + amostra grátis pra imprimir hoje. 💛">

<meta property="og:url" content="https://babadepapel.com.br/quiz/">

<!-- ================= META PIXEL ================= -->
<script>
var META_PIXEL_ID = '1016831947471937';
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');
// advanced matching: reaproveita o e-mail capturado em visita anterior
// (mesmo localStorage da landing) — o fbevents.js faz o hash antes de enviar.
var bpEmailSalvo = '';
try{ bpEmailSalvo = localStorage.getItem('bp_email') || ''; }catch(e){}
fbq('init', META_PIXEL_ID, bpEmailSalvo ? {em: bpEmailSalvo} : {});
fbq('track', 'PageView');
// ViewContent: sinal de topo de funil (quiz) pra otimização e retargeting.
fbq('track', 'ViewContent', {content_name: 'quiz_baba_de_papel', content_category: 'quiz'});
</script>
<noscript><img height="1" width="1" style="display:none" alt=""
src="https://www.facebook.com/tr?id=1016831947471937&ev=PageView&noscript=1"/></noscript>

<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;width:100%;background:#FFFDF8;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;
  }
  /* tela de carregamento da marca, escondida quando o iframe carrega */
  #carregando{
    position:fixed; inset:0; z-index:2;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; background:#FFFDF8;
    background-image:
      linear-gradient(rgba(77,150,255,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(77,150,255,.07) 1px, transparent 1px);
    background-size:30px 30px;
    transition:opacity .35s ease;
  }
  #carregando.oculto{opacity:0; pointer-events:none;}
  .marca{font-weight:800; font-size:30px; color:#FF6B6B; letter-spacing:.2px;}
  .spin{
    width:38px; height:38px; border-radius:50%;
    border:4px solid rgba(255,107,107,.25); border-top-color:#FF6B6B;
    animation:girar .8s linear infinite;
  }
  @keyframes girar{to{transform:rotate(360deg);}}
  #quizFrame{
    position:fixed; inset:0; z-index:1;
    width:100%; height:100%; border:0; display:block; background:#FFFDF8;
  }
</style>
</head>
<body>
  <div id="carregando">
    <div class="marca">Babá de Papel</div>
    <div class="spin" role="status" aria-label="Carregando o quiz"></div>
  </div>
  <iframe id="quizFrame" title="Quiz Babá de Papel" allow="clipboard-write"
          referrerpolicy="no-referrer-when-downgrade"></iframe>

<script>
(function(){
  var BASE = 'https://forms.douglasqueiroz.com/baba-de-papel';

  // 1 parâmetro só no link do anúncio (?ad=q1..q5) — evita '&' no link_url
  // do Meta (bug do conector) e mantém a atribuição por criativo.
  var AD_MAP = {
    q1: 'curiosidade',
    q2: 'marcos_idade',
    q3: 'amostra_gratis',
    q4: 'menos_tela',
    q5: 'plano_sob_medida'
  };

  var atual = new URLSearchParams(window.location.search);
  var ad = (atual.get('ad') || '').toLowerCase();
  var slug = AD_MAP[ad] || (ad ? ad : 'direto');

  var saida = new URLSearchParams();
  // UTMs fixas da campanha (utm_content varia por criativo)
  saida.set('utm_source', 'meta');
  saida.set('utm_medium', 'paid_social');
  saida.set('utm_campaign', 'quiz_baba_de_papel');
  saida.set('utm_content', slug);
  saida.set('utm_term', 'advantage_plus');
  // sck = chave de atribuição por criativo no Hotmart (best-effort via FormGuru)
  saida.set('sck', 'meta_quiz_' + (AD_MAP[ad] ? ad : 'direto'));

  // repassa parâmetros de clique/tracking que vierem na URL (sem duplicar)
  atual.forEach(function(v, k){
    if(/^(utm_|fbclid|gclid|ttclid|xcod|fbp|fbc)/.test(k) && !saida.has(k)){
      saida.set(k, v);
    }
  });

  var frame = document.getElementById('quizFrame');
  frame.src = BASE + '?' + saida.toString();

  // esconde o loader quando o quiz carregar (ou após um teto de segurança)
  var loader = document.getElementById('carregando');
  function esconder(){ loader.classList.add('oculto'); }
  frame.addEventListener('load', esconder);
  setTimeout(esconder, 4000);
})();
</script>
</body>
</html>
